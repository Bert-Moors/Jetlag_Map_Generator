config:
  name: "NL Casual Stations"
  exporters: ["googleMMaps", "fullkml"]

layers:
  Stations:
    stations:
      file: "input/nl_casual/stations-2023-new.csv"
      processors: [
        { name: "rename_column", columns: { geo_lat: "Latitude", geo_lng: "Longitude", name_long: "name" } },
        { name: "filter_by_column", column: "country", value: "NL" },
        { name: "lat_lon_to_points" }
      ]
      style:
        color: "ff377eb8"
  Hiding Zones:
    stations:
      file: "input/nl_casual/stations-2023-new.csv"
      processors: [
        { name: "rename_column", columns: { geo_lat: "Latitude", geo_lng: "Longitude", name_long: "name" } },
        { name: "filter_by_column", column: "country", value: "NL" },
        { name: "lat_lon_to_points" },
        {
          name: "hiding_zones",
          size: 500
        }
      ]
      style:
        color: "ff377eb8"
  Features:
    themeparks:
      file: "input/nl_casual/themeparks.csv"
      processors: [
        { name: "rename_column", columns: { latitude: "Latitude", longitude: "Longitude" } },
        { name: "lat_lon_to_points" }
      ]
      style:
        color: "ffff1493"
        size: 7
    universities:
      file: "input/nl_casual/universities.csv"
      processors: [
        { name: "rename_column", columns: { latitude: "Latitude", longitude: "Longitude" } },
        { name: "lat_lon_to_points" }
      ]
      style:
        color: "ffff1493"
        size: 7

    airports:
      file: "input/nl_casual/airports.csv"
      processors: [
        { name: "rename_column", columns: { latitude: "Latitude", longitude: "Longitude" } },
        { name: "lat_lon_to_points" }
      ]
      style:
        color: "ffffd700"
        size: 8

  Provinces:
    provinces:
      query: "[out:json][timeout:60];area[\"ISO3166-1\"=\"NL\"]->.a;rel[\"boundary\"=\"administrative\"][\"admin_level\"=\"4\"][\"ISO3166-2\"~\"^NL-\"](area.a);out geom;"
      geom_type: "polygons"
      processors: [
        { name: "simplify_geometry", tolerance: 0.001 }
      ]
      style:
        color: "ff1a1a1a"
        width: 3
        fill: "00000000"

  Train Lines:
    train_lines:
      processors: [
        {
          name: "simplified_lines",
          file: "input/nl_casual/routes_trainkms_randstad.json",
          key_column: "code",
          source_layer: "Stations",
          source_type: "stations",
          min_stops: 2
        }
      ]
      style:
        color: "ffe41a1c"
        width: 2
