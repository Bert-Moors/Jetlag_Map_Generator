config:
  name: H+S South Limburg
  exporters: ["osmA3Pdf"]
layers:
  Borders:
    Game Border:
      processors: [
        {
          name: "rename_column",
          columns: { Name: "name" }
        }
      ]
      style.width: 3
      file: "input/SL Border.kml"
    Gemeente:
      processors: [
        {
          name: "rename_column",
          columns: { Name: "name" }
        }
      ]
      file: "input/SL gemeentes.kml"
    Postcodes:
      file: "input/limburg_layers/Postcodes.kmz"
  Transit Stops:
    Any:
      file: "input/limburg_layers/Transit Stops.kmz"
  Transit Lines:
    "15":
      processors: [
        { name: "rename_column", columns: { Name: "name" } },
        { name: "filter_by_column", column: "ref", value: "15" }
      ]
      style.color: "ff1f77b4"
      style.width: 1.5
      style.dotted: true
      style.ignore_for_map_boundaries: true
      file: "input/limburg_layers/Transit Lines.kmz"
