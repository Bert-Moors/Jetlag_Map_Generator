        '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

