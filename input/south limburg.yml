config:
  name: H+S South Limburg
  exporters: ["googleMMaps", "fullkml"]
layers:
  Border:
    Game Border:
      processors: [
        {
          name: "rename_column",
          columns:{Name: "name"}
        }
      ]
      file: "input/SL Border.kml"
  Admin Divisions:
    Gemeente:
      processors: [
        {
          name: "rename_column",
          columns: { Name: "name" }
        }
      ]
      file: "input/SL gemeentes.kml"
  Transit:
    Train Station:
      geom_type: points
      query:
        '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         (
           nwr["railway"="station"]["operator"!="Zuid-Limburgse Stoomtrein Maatschappij"]["name"~".*"](area.targetMunicipalities);
         );

         out center;'
    Airport:
      geom_type: points
      query:
        '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         nwr["aeroway"="aerodrome"]["iata"](area.targetMunicipalities);

         out center;'
  Natural:
    Mountains:
      geom_type: points
      query:
        '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         nwr["natural"="peak"]["name"~".*"](area.targetMunicipalities);

         out center;'
  Points Of Interest:
    Campings:
      geom_type: points
      query:
          '[out:json][timeout:90];

           area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

           nwr["tourism"="camp_site"]["name"~".*"](area.targetMunicipalities);

           out center;'
    Mills:
      geom_type: points
      query:
        '[out:json][timeout:120];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         (
           nwr["man_made"="windmill"]["name"~".*"](area.targetMunicipalities);
           nwr["man_made"="watermill"]["name"~".*"](area.targetMunicipalities);
           nwr["building"="windmill"]["name"~".*"](area.targetMunicipalities);
           nwr["building"="watermill"]["name"~".*"](area.targetMunicipalities);
         );

         out center;'
    Museums:
      geom_type: points
      query:
        '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         nwr["tourism"="museum"]["name"~".*"](area.targetMunicipalities);

         out center;'
    Golf Courses:
      geom_type: points
      query:
         '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         nwr["leisure"="golf_course"]["name"~".*"](area.targetMunicipalities);

         out center;'
    Cinema:
      geom_type: points
      query:
        '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         nwr["amenity"="cinema"]["name"~".*"](area.targetMunicipalities);

         out center;'
    Zoos:
      geom_type: points
      query:
        '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         (
           nwr["tourism"="zoo"]["name"~".*"](area.targetMunicipalities);
           nwr["leisure"="petting_zoo"]["name"~".*"](area.targetMunicipalities);
         );

         out center;'
    Amusement Parks:
      geom_type: points
      query:
        '[out:json][timeout:180];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         (
           nwr["name"="Fun Valley Maastricht"](area.targetMunicipalities);
           nwr["name"="Fun Valley"](area.targetMunicipalities);
           nwr["name"="Kabelbaan Valkenburg"](area.targetMunicipalities);
           nwr["name"="Attractiepark Kabelbaan Valkenburg"](area.targetMunicipalities);
           nwr["name"="Mondo Verde"](area.targetMunicipalities);
           nwr["name"="Familiepark Mondo Verde"](area.targetMunicipalities);
           nwr["name"="Kinderstad Heerlen"](area.targetMunicipalities);
           nwr["name"="Adventure Valley Landgraaf"](area.targetMunicipalities);
           nwr["name"="Adventure Valley"](area.targetMunicipalities);
         )->.exactNames;

         (
           nwr["tourism"="theme_park"]["name"~".*"](area.targetMunicipalities);
           nwr["leisure"="amusement_park"]["name"~".*"](area.targetMunicipalities);
         )->.broadCategories;

         (.exactNames; .broadCategories;);

         out center;'
  Public Utilities:
    Hospital:
      geom_type: points
      query:
        '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         nwr["healthcare"~"hospital"]["name"~".*"](area.targetMunicipalities);

         out center;'
    Library:
      geom_type: points
      query:
        '[out:json][timeout:60];

         area["admin_level"="8"]["name"~"^(Eijsden-Margraten|Gulpen-Wittem|Heerlen|Kerkrade|Landgraaf|Maastricht|Meerssen|Simpelveld|Vaals|Valkenburg aan de Geul|Voerendaal)$"]->.targetMunicipalities;

         nwr["amenity"="library"]["name"~".*"](area.targetMunicipalities);

         out center;'