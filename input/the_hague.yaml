          relation["tourism"="viewpoint"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          node["tourism"="viewpoint"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
          way["tourism"="viewpoint"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
          relation["tourism"="viewpoint"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
