      style: { color: "ffb35806", href: "https://maps.google.com/mapfiles/kml/paddle/orange-circle.png" }
    castles_without_wiki:
      geom_type: "points"
      query:
        '
        [out:json][timeout:60];
        (
          node["historic"="castle"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          way["historic"="castle"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          relation["historic"="castle"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
        );
        out center;
        '
      style: { color: "fffdb863", href: "https://maps.google.com/mapfiles/kml/paddle/orange-blank.png" }
    public_art_with_wiki:
      geom_type: "points"
      query:
        '
        [out:json][timeout:60];
        (
          node["tourism"="artwork"]["name"]["artwork_type"~"statue|sculpture|installation|mural"]["wikipedia"](51.95,4.17,52.14,4.43);
          way["tourism"="artwork"]["name"]["artwork_type"~"statue|sculpture|installation|mural"]["wikipedia"](51.95,4.17,52.14,4.43);
          relation["tourism"="artwork"]["name"]["artwork_type"~"statue|sculpture|installation|mural"]["wikipedia"](51.95,4.17,52.14,4.43);
          node["tourism"="artwork"]["name"]["artwork_type"~"statue|sculpture|installation|mural"]["wikidata"](51.95,4.17,52.14,4.43);
          way["tourism"="artwork"]["name"]["artwork_type"~"statue|sculpture|installation|mural"]["wikidata"](51.95,4.17,52.14,4.43);
          relation["tourism"="artwork"]["name"]["artwork_type"~"statue|sculpture|installation|mural"]["wikidata"](51.95,4.17,52.14,4.43);
        );
        out center;
        '
      style: { color: "ff1b9e77", href: "https://maps.google.com/mapfiles/kml/paddle/ltblu-circle.png" }
    public_art_without_wiki:
      geom_type: "points"
      query:
        '
        [out:json][timeout:60];
        (
          node["tourism"="artwork"]["name"]["artwork_type"~"statue|sculpture|installation|mural"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          way["tourism"="artwork"]["name"]["artwork_type"~"statue|sculpture|installation|mural"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          relation["tourism"="artwork"]["name"]["artwork_type"~"statue|sculpture|installation|mural"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
        );
        out center;
        '
      style: { color: "ff66c2a5", href: "https://maps.google.com/mapfiles/kml/paddle/ltblu-blank.png" }
    attractions_with_wiki:
      geom_type: "points"
      query:
        '
        [out:json][timeout:60];
        (
          node["tourism"="attraction"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          way["tourism"="attraction"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          relation["tourism"="attraction"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          node["tourism"="attraction"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
          way["tourism"="attraction"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
          relation["tourism"="attraction"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
        );
        out center;
        '
      style: { color: "ffe7298a", href: "https://maps.google.com/mapfiles/kml/paddle/pink-circle.png" }
    attractions_without_wiki:
      geom_type: "points"
      query:
        '
        [out:json][timeout:60];
        (
          node["tourism"="attraction"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          way["tourism"="attraction"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          relation["tourism"="attraction"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
        );
