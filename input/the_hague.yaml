        out center;
        '
      style: { color: "ff0571b0", href: "https://maps.google.com/mapfiles/kml/paddle/blu-circle.png" }
    viewpoints_without_wiki:
      geom_type: "points"
      query:
        '
        [out:json][timeout:60];
        (
          node["tourism"="viewpoint"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          way["tourism"="viewpoint"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          relation["tourism"="viewpoint"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
        );
        out center;
        '
      style: { color: "ff92c5de", href: "https://maps.google.com/mapfiles/kml/paddle/blu-blank.png" }
    castles_with_wiki:
      geom_type: "points"
      query:
        '
        [out:json][timeout:60];
        (
          node["historic"="castle"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          way["historic"="castle"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          relation["historic"="castle"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          node["historic"="castle"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
          way["historic"="castle"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
          relation["historic"="castle"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
