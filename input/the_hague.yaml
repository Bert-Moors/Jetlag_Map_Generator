      style: { color: "fff1b6da", href: "https://maps.google.com/mapfiles/kml/paddle/pink-blank.png" }
    historic_sites_with_wiki:
      geom_type: "points"
      query:
        '
        [out:json][timeout:60];
        (
          node["historic"~"archaeological_site|ruins"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          way["historic"~"archaeological_site|ruins"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          relation["historic"~"archaeological_site|ruins"]["name"]["wikipedia"](51.95,4.17,52.14,4.43);
          node["historic"~"archaeological_site|ruins"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
          way["historic"~"archaeological_site|ruins"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
          relation["historic"~"archaeological_site|ruins"]["name"]["wikidata"](51.95,4.17,52.14,4.43);
        );
        out center;
        '
      style: { color: "ff7570b3", href: "https://maps.google.com/mapfiles/kml/paddle/wht-circle.png" }
    historic_sites_without_wiki:
      geom_type: "points"
      query:
        '
        [out:json][timeout:60];
        (
          node["historic"~"archaeological_site|ruins"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          way["historic"~"archaeological_site|ruins"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
          relation["historic"~"archaeological_site|ruins"]["name"][!"wikipedia"][!"wikidata"](51.95,4.17,52.14,4.43);
        );
        out center;
        '
      style: { color: "ffbcbddc", href: "https://maps.google.com/mapfiles/kml/paddle/wht-blank.png" }
